name: Release

# Push a tag like v1.0.0 to build the installer and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Version from tag
        id: v
        shell: pwsh
        run: |
          # Only real version tags (v1.2.3 or v1.2.3-beta.1) build a release; a manual run on a branch has no version.
          if ("${{ github.ref_type }}" -ne "tag") { throw "Run this workflow on a version tag (v1.2.3), not on a branch." }
          $v = "${{ github.ref_name }}".TrimStart('v')
          if (-not ($v -match '^\d+\.\d+\.\d+(-[\w.]+)?$')) { throw "Tag '${{ github.ref_name }}' is not a version (v1.2.3 or v1.2.3-beta.1)." }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test tests/DynamicBay.Tests -c Release

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: ./tools/build-release.ps1 -Version ${{ steps.v.outputs.version }}

      # The installed app has to start after an update (older releases -> this one), with package identity.
      - name: Update smoke test
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/update-smoke.ps1 -NewInstaller artifacts/DynamicBay-Setup-${{ steps.v.outputs.version }}.exe -Work "${{ runner.temp }}/smoke"

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: smoke-logs
          path: |
            ${{ runner.temp }}/smoke/*.log
            ~/AppData/Roaming/DynamicBay/logs/*.log

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: DynamicBay ${{ steps.v.outputs.version }}
          files: artifacts/DynamicBay-Setup-${{ steps.v.outputs.version }}.exe
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            **Download:** `DynamicBay-Setup-${{ steps.v.outputs.version }}.exe` unten herunterladen und ausführen.
            Alles Nötige (.NET) ist enthalten. Windows 10 (2004) oder Windows 11, 64 Bit.

            Hinweis: Der Installer ist nicht von einer Zertifizierungsstelle signiert. Windows SmartScreen zeigt
            deshalb evtl. „Unbekannter Herausgeber“ – über „Weitere Informationen“ → „Trotzdem ausführen“ starten.
